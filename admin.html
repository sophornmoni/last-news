<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LAST NEWS — Admin</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,"Noto Sans Khmer","Khmer OS",sans-serif;
    background:#f3f4f6;
    color:#111827;
}

.header{
    background:#111827;
    color:white;
    padding:18px 20px;
}

.header-inner{
    max-width:900px;
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:24px;
    font-weight:900;
}

.logo span{
    color:#ed1748;
}

.back{
    color:white;
    font-size:12px;
    text-decoration:none;
}

main{
    max-width:900px;
    margin:25px auto 50px;
    padding:0 15px;
}

.panel{
    background:white;
    padding:25px;
    border-radius:10px;

    box-shadow:
        0 4px 18px rgba(0,0,0,.08);
}

h1{
    font-size:24px;
    margin-bottom:20px;
}

label{
    display:block;

    font-size:13px;
    font-weight:bold;

    margin:15px 0 6px;
}

input,
select,
textarea{
    width:100%;

    border:1px solid #d1d5db;
    border-radius:6px;

    padding:11px;

    font-family:inherit;
    font-size:13px;

    outline:none;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#ed1748;
}

textarea{
    min-height:180px;
    resize:vertical;
}

.checks{
    display:flex;
    gap:20px;
    margin-top:15px;
}

.check{
    display:flex;
    align-items:center;
    gap:7px;

    font-size:12px;
}

.check input{
    width:auto;
}

button{
    width:100%;

    border:0;
    border-radius:6px;

    background:#ed1748;
    color:white;

    padding:13px;

    margin-top:22px;

    font-size:14px;
    font-weight:bold;

    cursor:pointer;
}

button:hover{
    background:#be123c;
}

.notice{
    display:none;

    margin-top:15px;

    padding:12px;

    border-radius:6px;

    background:#dcfce7;
    color:#166534;

    font-size:12px;
}

.warning{
    margin-top:18px;

    padding:12px;

    background:#fff7ed;
    color:#9a3412;

    border-radius:6px;

    font-size:11px;
    line-height:1.6;
}

@media(max-width:600px){

    .header{
        padding:13px 10px;
    }

    .logo{
        font-size:18px;
    }

    .back{
        font-size:9px;
    }

    main{
        margin-top:15px;
        padding:0 9px;
    }

    .panel{
        padding:15px;
        border-radius:7px;
    }

    h1{
        font-size:19px;
    }

    label{
        font-size:10px;
    }

    input,
    select,
    textarea{
        font-size:11px;
        padding:9px;
    }

    textarea{
        min-height:150px;
    }

    button{
        font-size:11px;
    }

}

</style>
</head>

<body>


<header class="header">

    <div class="header-inner">

        <div class="logo">
            LAST<span>NEWS</span>
        </div>

        <a href="index.html" class="back">
            ← ត្រឡប់ទៅ Website
        </a>

    </div>

</header>


<main>

<div class="panel">

    <h1>
        📝 Create New Article
    </h1>


    <label>
        ចំណងជើងអត្ថបទ
    </label>

    <input
        type="text"
        id="title"
        placeholder="បញ្ចូលចំណងជើង..."
    >


    <label>
        ប្រភេទព័ត៌មាន
    </label>

    <select id="category">

        <option value="CAMBODIA">
            🇰🇭 កម្ពុជា
        </option>

        <option value="WORLD">
            🌍 ពិភពលោក
        </option>

        <option value="BUSINESS">
            💼 អាជីវកម្ម
        </option>

        <option value="TECHNOLOGY">
            💻 បច្ចេកវិទ្យា
        </option>

        <option value="SPORTS">
            ⚽ កីឡា
        </option>

        <option value="ENTERTAINMENT">
            🎬 កម្សាន្ត
        </option>

    </select>


    <label>
        URL រូបភាព
    </label>

    <input
        type="url"
        id="image"
        placeholder="https://example.com/image.jpg"
    >


    <label>
        សេចក្ដីសង្ខេប
    </label>

    <textarea
        id="description"
        placeholder="សរសេរសេចក្ដីសង្ខេបអត្ថបទ..."
    ></textarea>


    <label>
        ខ្លឹមសារអត្ថបទ
    </label>

    <textarea
        id="content"
        placeholder="សរសេរខ្លឹមសារអត្ថបទនៅទីនេះ..."
    ></textarea>


    <label>
        អ្នកនិពន្ធ
    </label>

    <input
        type="text"
        id="author"
        value="CHHUN SOPHORN"
    >


    <div class="checks">

        <label class="check">

            <input
                type="checkbox"
                id="featured"
            >

            Featured

        </label>


        <label class="check">

            <input
                type="checkbox"
                id="breaking"
            >

            Breaking News

        </label>

    </div>


    <button
        onclick="createArticle()">

        🚀 CREATE ARTICLE

    </button>


    <div
        class="notice"
        id="notice">

        អត្ថបទត្រូវបានរៀបចំរួចរាល់!

    </div>


    <div class="warning">

        ⚠️ ចំណាំ៖ Version នេះគឺជា Admin Form សម្រាប់
        រៀបចំទិន្នន័យអត្ថបទ។ GitHub Pages មិនអនុញ្ញាតឱ្យ
        Website នៅខាង Client សរសេរ file
        <b>articles.json</b> ដោយផ្ទាល់ទេ។

    </div>

</div>

</main>


<script>

function createArticle(){

    const title =
        document.getElementById("title").value.trim();

    const category =
        document.getElementById("category").value;

    const image =
        document.getElementById("image").value.trim();

    const description =
        document.getElementById("description").value.trim();

    const content =
        document.getElementById("content").value.trim();

    const author =
        document.getElementById("author").value.trim();

    const featured =
        document.getElementById("featured").checked;

    const breaking =
        document.getElementById("breaking").checked;


    if(!title){

        alert("សូមបញ្ចូលចំណងជើងអត្ថបទ");

        return;
    }


    if(!content){

        alert("សូមបញ្ចូលខ្លឹមសារអត្ថបទ");

        return;
    }


    const article = {

        id:Date.now(),

        title:title,

        category:category,

        image:image,

        description:description,

        content:content,

        author:author || "CHHUN SOPHORN",

        date:new Date()
            .toISOString()
            .split("T")[0],

        featured:featured,

        breaking:breaking

    };


    console.log(article);


    const notice =
        document.getElementById("notice");

    notice.style.display="block";

    notice.innerHTML =
        "✅ Article បានរៀបចំរួច!<br><br>" +
        "បច្ចុប្បន្នត្រូវយកទិន្នន័យនេះទៅ Publish ក្នុង GitHub។";


    alert(
        "Article បានបង្កើតទិន្នន័យរួចរាល់។ " +
        "សូមមើល Browser Console សម្រាប់ JSON។"
    );

}

</script>


</body>
</html>
