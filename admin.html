<!DOCTYPE html>
<html lang="km">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>LAST NEWS — Admin</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:
        Arial,
        "Noto Sans Khmer",
        "Khmer OS",
        sans-serif;

    background:#f3f4f6;
    color:#111827;
}


/* HEADER */

.header{
    background:#111827;
    color:white;

    padding:16px 15px;
}

.header-inner{
    max-width:900px;
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:24px;
    font-weight:900;
}

.logo span{
    color:#ed1748;
}

.back{
    color:white;
    text-decoration:none;

    font-size:12px;
}


/* MAIN */

main{
    max-width:900px;

    margin:25px auto 50px;

    padding:0 15px;
}

.panel{
    background:white;

    padding:25px;

    border-radius:10px;

    box-shadow:
        0 4px 18px
        rgba(0,0,0,.08);
}

h1{
    font-size:24px;

    margin-bottom:20px;
}


/* LABEL */

label{
    display:block;

    font-size:13px;
    font-weight:bold;

    margin:16px 0 6px;
}


/* INPUT */

input,
select,
textarea{

    width:100%;

    border:1px solid #d1d5db;

    border-radius:7px;

    padding:11px;

    font-family:inherit;

    font-size:13px;

    outline:none;

    background:white;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#ed1748;
}

textarea{
    min-height:180px;

    resize:vertical;
}


/* IMAGE UPLOAD */

.upload-box{

    border:2px dashed #d1d5db;

    border-radius:9px;

    padding:20px;

    text-align:center;

    background:#fafafa;

    cursor:pointer;

    transition:.2s;
}

.upload-box:hover{

    border-color:#ed1748;

    background:#fff1f2;
}

.upload-icon{

    font-size:40px;

    margin-bottom:8px;
}

.upload-title{

    font-size:14px;

    font-weight:bold;

    margin-bottom:4px;
}

.upload-text{

    color:#777;

    font-size:11px;
}


/* HIDE REAL INPUT */

#imageFile{
    display:none;
}


/* IMAGE PREVIEW */

.preview{

    display:none;

    margin-top:15px;

    border-radius:8px;

    overflow:hidden;

    background:#111;
}

.preview img{

    width:100%;

    max-height:350px;

    object-fit:cover;
}

.remove-image{

    display:none;

    width:100%;

    margin-top:7px;

    padding:8px;

    border:0;

    border-radius:6px;

    background:#374151;

    color:white;

    cursor:pointer;

    font-size:11px;
}


/* CHECKBOX */

.checks{

    display:flex;

    gap:20px;

    margin-top:15px;
}

.check{

    display:flex;

    align-items:center;

    gap:7px;

    font-size:12px;

    font-weight:normal;

    margin:0;
}

.check input{

    width:auto;
}


/* BUTTON */

button{

    width:100%;

    border:0;

    border-radius:7px;

    background:#ed1748;

    color:white;

    padding:13px;

    margin-top:22px;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;
}

button:hover{

    background:#be123c;
}


/* NOTICE */

.notice{

    display:none;

    margin-top:15px;

    padding:12px;

    border-radius:6px;

    background:#dcfce7;

    color:#166534;

    font-size:12px;

    line-height:1.6;
}


/* WARNING */

.warning{

    margin-top:18px;

    padding:12px;

    background:#fff7ed;

    color:#9a3412;

    border-radius:6px;

    font-size:11px;

    line-height:1.7;
}


/* MOBILE */

@media(max-width:600px){

    .header{

        padding:12px 9px;
    }

    .logo{

        font-size:18px;
    }

    .back{

        font-size:9px;
    }

    main{

        margin-top:15px;

        padding:0 9px;
    }

    .panel{

        padding:15px;

        border-radius:7px;
    }

    h1{

        font-size:19px;
    }

    label{

        font-size:10px;
    }

    input,
    select,
    textarea{

        font-size:11px;

        padding:9px;
    }

    textarea{

        min-height:150px;
    }

    .upload-box{

        padding:18px 10px;
    }

    .upload-icon{

        font-size:32px;
    }

    .upload-title{

        font-size:11px;
    }

    .upload-text{

        font-size:8px;
    }

    .preview img{

        max-height:220px;
    }

    .check{

        font-size:9px;
    }

    button{

        font-size:11px;
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<header class="header">

    <div class="header-inner">

        <div class="logo">

            LAST<span>NEWS</span>

        </div>

        <a
            href="index.html"
            class="back"
        >
            ← Website
        </a>

    </div>

</header>


<!-- MAIN -->

<main>

<div class="panel">


<h1>
    📝 Create New Article
</h1>


<!-- TITLE -->

<label>
    ចំណងជើងអត្ថបទ
</label>

<input
    type="text"
    id="title"
    placeholder="បញ្ចូលចំណងជើង..."
>


<!-- CATEGORY -->

<label>
    ប្រភេទព័ត៌មាន
</label>

<select id="category">

    <option value="CAMBODIA">
        🇰🇭 កម្ពុជា
    </option>

    <option value="WORLD">
        🌍 ពិភពលោក
    </option>

    <option value="BUSINESS">
        💼 អាជីវកម្ម
    </option>

    <option value="TECHNOLOGY">
        💻 បច្ចេកវិទ្យា
    </option>

    <option value="SPORTS">
        ⚽ កីឡា
    </option>

    <option value="ENTERTAINMENT">
        🎬 កម្សាន្ត
    </option>

</select>


<!-- IMAGE -->

<label>
    រូបភាពអត្ថបទ
</label>


<label
    class="upload-box"
    for="imageFile"
>

    <div class="upload-icon">
        📷
    </div>

    <div class="upload-title">
        ជ្រើសរើសរូបភាព
    </div>

    <div class="upload-text">
        ចុចទីនេះដើម្បី Upload រូបពីទូរស័ព្ទ
    </div>

</label>


<input
    type="file"
    id="imageFile"
    accept="image/*"
>


<!-- PREVIEW -->

<div
    class="preview"
    id="preview"
>

    <img
        id="previewImage"
        alt="Preview"
    >

</div>


<button
    type="button"
    class="remove-image"
    id="removeImage"
    onclick="removeImage()"
>

    ✕ លុបរូបភាព

</button>


<!-- DESCRIPTION -->

<label>
    សេចក្ដីសង្ខេប
</label>

<textarea
    id="description"
    placeholder="សរសេរសេចក្ដីសង្ខេបអត្ថបទ..."
></textarea>


<!-- CONTENT -->

<label>
    ខ្លឹមសារអត្ថបទ
</label>

<textarea
    id="content"
    placeholder="សរសេរខ្លឹមសារអត្ថបទ..."
></textarea>


<!-- AUTHOR -->

<label>
    អ្នកនិពន្ធ
</label>

<input
    type="text"
    id="author"
    value="CHHUN SOPHORN"
>


<!-- OPTIONS -->

<div class="checks">


    <label class="check">

        <input
            type="checkbox"
            id="featured"
        >

        ⭐ Featured

    </label>


    <label class="check">

        <input
            type="checkbox"
            id="breaking"
        >

        🔴 Breaking News

    </label>


</div>


<!-- CREATE -->

<button
    type="button"
    onclick="createArticle()"
>

    🚀 CREATE ARTICLE

</button>


<!-- NOTICE -->

<div
    class="notice"
    id="notice"
></div>


<!-- WARNING -->

<div class="warning">

    ⚠️ <b>បច្ចុប្បន្ន:</b>
    រូបភាពដែលអ្នកជ្រើសរើសអាច Preview
    នៅក្នុង Admin បាន។
    ជំហានបន្ទាប់យើងនឹងភ្ជាប់
    Image Upload ទៅ Storage
    ដើម្បីឱ្យរូបភាពអាចរក្សាទុក
    និងបង្ហាញនៅលើ Website។

</div>


</div>

</main>


<script>


/* =========================
   IMAGE UPLOAD PREVIEW
========================= */

const imageFile =
    document.getElementById("imageFile");

const preview =
    document.getElementById("preview");

const previewImage =
    document.getElementById("previewImage");

const removeButton =
    document.getElementById("removeImage");


imageFile.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        if(!file){

            return;
        }


        if(!file.type.startsWith("image/")){

            alert(
                "សូមជ្រើសរើសតែរូបភាពប៉ុណ្ណោះ។"
            );

            this.value="";

            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            function(e){

                previewImage.src =
                    e.target.result;

                preview.style.display =
                    "block";

                removeButton.style.display =
                    "block";

            };


        reader.readAsDataURL(file);

    }
);


/* =========================
   REMOVE IMAGE
========================= */

function removeImage(){

    imageFile.value="";

    previewImage.src="";

    preview.style.display="none";

    removeButton.style.display="none";

}


/* =========================
   CREATE ARTICLE
========================= */

function createArticle(){

    const title =
        document
        .getElementById("title")
        .value
        .trim();


    const category =
        document
        .getElementById("category")
        .value;


    const description =
        document
        .getElementById("description")
        .value
        .trim();


    const content =
        document
        .getElementById("content")
        .value
        .trim();


    const author =
        document
        .getElementById("author")
        .value
        .trim();


    const featured =
        document
        .getElementById("featured")
        .checked;


    const breaking =
        document
        .getElementById("breaking")
        .checked;


    const file =
        imageFile.files[0];


    /* VALIDATION */

    if(!title){

        alert(
            "សូមបញ្ចូលចំណងជើងអត្ថបទ។"
        );

        return;
    }


    if(!content){

        alert(
            "សូមបញ្ចូលខ្លឹមសារអត្ថបទ។"
        );

        return;
    }


    if(!file){

        alert(
            "សូម Upload រូបភាព។"
        );

        return;
    }


    /* ARTICLE DATA */

    const article = {

        id:
            Date.now(),

        title:
            title,

        category:
            category,

        imageFile:
            file.name,

        description:
            description,

        content:
            content,

        author:
            author ||
            "CHHUN SOPHORN",

        date:
            new Date()
            .toISOString()
            .split("T")[0],

        featured:
            featured,

        breaking:
            breaking

    };


    console.log(
        "ARTICLE:",
        article
    );


    /* NOTICE */

    const notice =
        document
        .getElementById("notice");


    notice.style.display =
        "block";


    notice.innerHTML =

        "✅ Article ត្រូវបានរៀបចំរួច!<br>" +

        "📷 រូបភាព: " +
        file.name +
        "<br>" +

        "📝 ចំណងជើង: " +
        title +
        "<br><br>" +

        "⏳ ជំហានបន្ទាប់៖ " +
        ភ្ជាប់ Image Upload ទៅ Storage " +
        "និង Publish ទៅ LAST NEWS។";


    window.scrollTo({

        top:
            document.body.scrollHeight,

        behavior:
            "smooth"

    });

}


</script>


</body>
</html>
